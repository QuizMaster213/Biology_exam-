<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان الأحياء - الدعامة والحركة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 800px;
    width: 100%;
    padding: 40px;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  /* لوجو HIMA */
  .hima-logo {
    text-align: center;
    margin-bottom: 20px;
  }
  .hima-logo img {
    max-width: 250px;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  h1 { color: #1e3c72; text-align: center; margin-bottom: 10px; font-size: 28px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 15px; }
  .info-bar {
    display: flex;
    justify-content: space-between;
    background: #f0f4ff;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 25px;
    font-weight: bold;
    color: #1e3c72;
    flex-wrap: wrap;
    gap: 10px;
  }
  .name-input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 18px;
    text-align: center;
    margin-bottom: 15px;
    transition: 0.3s;
  }
  .name-input:focus { outline: none; border-color: #2a5298; }
  .btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(30,60,114,0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .question-box {
    background: #f9faff;
    border-right: 5px solid #2a5298;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .question-text {
    font-size: 17px;
    font-weight: bold;
    color: #333;
    margin-bottom: 15px;
    line-height: 1.6;
  }
  .option {
    display: block;
    padding: 12px 15px;
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 16px;
  }
  .option:hover { border-color: #2a5298; background: #f0f4ff; }
  .option input { margin-left: 10px; }
  .option.selected { border-color: #2a5298; background: #e6efff; }
  .result-box { text-align: center; padding: 40px 20px; }
  .result-score { font-size: 60px; font-weight: bold; color: #2a5298; margin: 20px 0; }
  .result-msg { font-size: 20px; color: #555; margin-bottom: 10px; }
  .hidden { display: none; }
  .progress {
    height: 8px;
    background: #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1e3c72, #2a5298);
    transition: width 0.4s ease;
    width: 0%;
  }
  .review-box {
    background: #fff5f5;
    border-right: 5px solid #e74c3c;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
    text-align: right;
  }
  .review-title { color: #c0392b; font-size: 18px; font-weight: bold; margin-bottom: 12px; text-align: center; }
  .review-q {
    background: #fff;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 15px;
    line-height: 1.7;
    border: 1px solid #ffd6d6;
  }
  .review-q-num { color: #c0392b; font-weight: bold; }
  .review-answer-wrong { color: #e74c3c; font-weight: bold; margin-top: 6px; }
  .review-answer-right { color: #27ae60; font-weight: bold; margin-top: 4px; }
  #timerDisplay { color: #2a5298; font-weight: bold; }
  .nav-buttons { display: flex; gap: 10px; margin-top: 10px; }
  .btn-nav {
    flex: 1;
    padding: 15px;
    background: #e0e0e0;
    color: #333;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn-nav:hover { background: #d0d0d0; }
  .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">

  <div id="startScreen">
    <div class="hima-logo">
      <img src="https://i.postimg.cc/T1PF2mT4/file-0000000053488210b6366ac3d080117a.png" alt="HIMA Logo">
    </div>
    
    <h1>🧬 امتحان الأحياء</h1>
    <p class="subtitle">الصف الثالث الثانوي - الفصل الأول (الدعامة والحركة)</p>
    <div class="info-bar">
      <span>📝 عدد الأسئلة: 15</span>
      <span>🎯 الدرجة: 30</span>
    </div>
    <input type="text" id="studentName" class="name-input" placeholder="اكتب اسمك هنا..." />
    <button class="btn" onclick="startExam()">ابدأ الامتحان 🚀</button>
  </div>

  <div id="examScreen" class="hidden">
    <div class="info-bar">
      <span id="questionCounter">السؤال 1 من 15</span>
      <span id="timerDisplay">⏱️ 00:00</span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question-box">
      <div class="question-text" id="questionText"></div>
      <div id="optionsContainer"></div>
    </div>
    <div class="nav-buttons">
      <button class="btn-nav" id="prevBtn" onclick="prevQuestion()" disabled>⬅️ السابق</button>
      <button class="btn-nav" id="nextBtn" onclick="nextQuestion()">التالي ➡️</button>
    </div>
    <button class="btn" id="finishBtn" onclick="finishExam()" style="margin-top:15px;">إنهاء الامتحان وعرض النتيجة 🎯</button>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="result-box">
      <h1>🎉 خلصت الامتحان يا <span id="resultName"></span></h1>
      <div class="result-score"><span id="finalScore">0</span> / 30</div>
      <p class="result-msg" id="resultMessage"></p>
      <div id="wrongReview"></div>
    </div>
  </div>

</div>

<script>
const questions = [
  {
    q: "أي مما يلي يحدث عند حدوث الشد العضلي في العضلة الهيكلية؟",
    options: ["توقف عمل إنزيمات إنتاج ATP", "زيادة طول المنطقة الداكنة", "توقف حركة خيوط الأكتين", "زيادة طول المسافة بين خطي Z"],
    correct: 2,
    points: 2
  },
  {
    q: "ما السبب المباشر لإجهاد العضلة التوأمية؟",
    options: ["عدم نقل الدم للأكسجين الكافي للعضلة", "نقص جزينات ATP", "زيادة حمض اللاكتيك", "انقباض العضلة الممتلئ والسرعة"],
    correct: 2,
    points: 2
  },
  {
    q: "أي مما يلي يتشابه فيه وظيفيا السيوبرين والكيوتين؟",
    options: ["كلاهما يمنح النبات المرونة والقوة", "كلاهما موجود في نسيج الكولنشيمي", "كلاهما يمنع نفاذ الماء عبر جدران الخلايا", "كلاهما يتكون من مركبات كيميائية بسيطة"],
    correct: 2,
    points: 2
  },
  {
    q: "في مفصل الركبة، أي مما يلي يحدث مباشرة إذا حدث كسر في رأس الشظية؟",
    options: ["حركة الرباط الصليبي الخلفي", "حركة الرباط الجانبي", "حركة الرباط الصليبي الأمامي", "حركة الرباط الوسطي"],
    correct: 1,
    points: 2
  },
  {
    q: "تشترك عضلات جدران الأوعية الدموية مع عضلة الفخذ في وجود ....................",
    options: ["الساركومير", "الساركوبلازم", "المنطقة المضية", "المنطقة شبه المضية"],
    correct: 1,
    points: 2
  },
  {
    q: "أي مما يلي ليس له علاقة بحدوث الشد العضلي؟",
    options: ["سرعة الانقباض والانبساط", "عدد اللييفات العضلية", "عدد جزينات ATP في العضلة", "نسبة الأكسجين في العضلة"],
    correct: 1,
    points: 2
  },
  {
    q: "إذا حدث قطع للرباط الجانبي للركبة فإن ذلك يؤثر على اتجاه حركة عظمة ....................",
    options: ["الشظية", "القصبة", "الفخذ", "الرضفة"],
    correct: 0,
    points: 2
  },
  {
    q: "أي مما يلي يمثل وجه الشبه بين الحركة السيتوبلازمية في النبات وحركة الشد في محاليق النبات؟",
    options: ["كلاهما يعتمد بشكل مباشر على الضوء", "كلاهما يحدث في جميع خلايا النبات", "كلاهما يتطلب استهلاك جزينات ATP", "كلاهما يؤدي إلى تغيير موضع النبات بالكامل"],
    correct: 2,
    points: 2
  },
  {
    q: "عند قياس سرعة الاستجابة الحركية لخمس حيوانات مختلفة، وجد أن الفروق بينها في الاستجابة ترجع إلى:",
    options: ["قوة المفاصل والأربطة", "قوة العضلات ومرونة الأوتار", "كفاءة نقل السبال العصبي للعضلات", "كفاءة الغدد الصماء المرتبطة بأداء العضلات"],
    correct: 2,
    points: 2
  },
  {
    q: "أي من أنواع الحركة التالية في النبات لا تنظمه الهرمونات النباتية؟",
    options: ["حركة الشد بواسطة المحاليق", "حركة اللمس", "الانتحاء الأرضي", "الانتحاء الضوئي"],
    correct: 1,
    points: 2
  },
  {
    q: "القطعة العضلية (الساركومير) وهي جزء من الليفة العضلية تحتوي على ....................",
    options: ["منطقة أكتين فقط / منطقة واحدة ميوسين فقط (عند الانقباض الشديد)", "منطقة أكتين فقط / منطقة واحدة أكتين وميوسين (عند الانقباض الشديد)", "منطقة أكتين فقط / منطقتين أكتين وميوسين / منطقة واحدة ميوسين (عند الانبساط)", "منطقة أكتين فقط / منطقة واحدة أكتين وميوسين / منطقة واحدة ميوسين (عند الانبساط)"],
    correct: 1,
    points: 2
  },
  {
    q: "أي مما يلي يعد المؤثر المباشر المسبب لانقباض العضلات؟",
    options: ["أيونات الكالسيوم", "السيال العصبي", "الناقل العصبي", "مؤثر خارجي أو داخل"],
    correct: 2,
    points: 2
  },
  {
    q: "عند حدوث خلل في الجزء الأسفل من جسم الفقرة 18 وتنموها المستعرض فإنه يحدث خلل في اتصالها بـ:",
    options: ["الضلع العام الأول، والفقرة 19", "الفقرة 17، والضلع 8", "الفقرتين 19، 17", "الفقرة 19، والضلع 8"],
    correct: 0,
    points: 2
  },
  {
    q: "كل ما يأتي صحيح عن الحركة الموضعية ما عدا:",
    options: ["لها دور في عملية الهضم", "يقوم بها معظم الكائنات الحية", "يستدل على حدوثها من حركة البلاستيدات الخضراء", "يعد الانتحاء الضوئي وحركة الشد في النبات أمثلة لها"],
    correct: 2,
    points: 2
  },
  {
    q: "تظهر العضلة الهيكلية تحت الميكروسكوب بمظهر مخطط ويرجع ذلك إلى:",
    options: ["وجود مناطق داكنة وأخرى مضيئة بالتبادل", "وجود خيوط بروتينية رأسية", "وجود خيوط بروتينية أفقية", "وجود فراغات بين الألياف العضلية"],
    correct: 0,
    points: 2
  }
];

const TELEGRAM_BOT_TOKEN = "8863503654:AAHL1pjsZw23WDNIG8xbHOe2mEgUTBvLJoE";
const TELEGRAM_CHAT_ID = "6623245277";
const TOTAL_SCORE = 30;

let studentName = "";
let currentIndex = 0;
let score = 0;
let answersLog = [];
let startTime = null;
let timerInterval = null;
let clientIP = "غير معروف";
let deviceInfo = "غير معروف";
let userAnswers = new Array(questions.length).fill(null);

function startExam() {
  const nameInput = document.getElementById("studentName").value.trim();
  if (!nameInput) {
    alert("اكتب اسمك الأول يا بطل 😅");
    return;
  }
  studentName = nameInput;

  fetch("https://api.ipify.org?format=json")
    .then(res => res.json())
    .then(data => { clientIP = data.ip; })
    .catch(() => { clientIP = "فشل الجلب"; });

  deviceInfo = `${navigator.platform} - ${navigator.userAgent.substring(0, 80)}`;

  startTime = new Date();
  timerInterval = setInterval(updateTimer, 1000);

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("examScreen").classList.remove("hidden");
  loadQuestion();
}

function updateTimer() {
  const now = new Date();
  const diff = Math.floor((now - startTime) / 1000);
  const mins = String(Math.floor(diff / 60)).padStart(2, "0");
  const secs = String(diff % 60).padStart(2, "0");
  document.getElementById("timerDisplay").textContent = `⏱️ ${mins}:${secs}`;
}

function loadQuestion() {
  const q = questions[currentIndex];
  document.getElementById("questionCounter").textContent = `السؤال ${currentIndex + 1} من ${questions.length}`;
  document.getElementById("progressFill").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
  document.getElementById("questionText").textContent = q.q;

  const optionsContainer = document.getElementById("optionsContainer");
  optionsContainer.innerHTML = "";
  const labels = ["أ", "ب", "ج", "د"];

  q.options.forEach((opt, i) => {
    const label = document.createElement("label");
    label.className = "option";
    if (userAnswers[currentIndex] === i) {
      label.classList.add("selected");
    }
    label.innerHTML = `<input type="radio" name="q${currentIndex}" value="${i}" ${userAnswers[currentIndex] === i ? 'checked' : ''} /> ${labels[i]}) ${opt}`;
    label.addEventListener("click", () => selectOption(label, i));
    optionsContainer.appendChild(label);
  });

  document.getElementById("prevBtn").disabled = currentIndex === 0;
  document.getElementById("nextBtn").disabled = currentIndex === questions.length - 1;
}

function selectOption(label, index) {
  document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
  label.classList.add("selected");
  label.querySelector("input").checked = true;
  userAnswers[currentIndex] = index;
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion();
  }
}

function finishExam() {
  const unanswered = userAnswers.filter(a => a === null).length;
  let confirmMsg = "هل أنت متأكد من إنهاء الامتحان؟";
  if (unanswered > 0) {
    confirmMsg = `لديك ${unanswered} أسئلة لم تتم الإجابة عليها. هل أنت متأكد من التسليم؟`;
  }

  if (!confirm(confirmMsg)) return;

  clearInterval(timerInterval);

  score = 0;
  answersLog = [];
  const labels = ["أ", "ب", "ج", "د"];

  userAnswers.forEach((ans, idx) => {
    const isCorrect = ans === questions[idx].correct;
    if (isCorrect) score += questions[idx].points;
    answersLog.push({
      q: idx + 1,
      chosen: ans,
      correct: questions[idx].correct,
      isCorrect: isCorrect
    });
  });

  document.getElementById("examScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");
  document.getElementById("resultName").textContent = studentName;
  document.getElementById("finalScore").textContent = score;

  const percentage = (score / TOTAL_SCORE) * 100;
  let msg = "";
  if (percentage >= 90) msg = "ممتاز يا وحش! 🌟";
  else if (percentage >= 75) msg = "جيد جدًا، كمّل كده 💪";
  else if (percentage >= 50) msg = "مقبول، محتاج مراجعة 📚";
  else msg = "راجع الفصل تاني يا بطل ❤️";
  document.getElementById("resultMessage").textContent = msg;

  showWrongAnswers();
  sendToTelegram(percentage);
}

function showWrongAnswers() {
  const wrongOnes = answersLog.filter(a => !a.isCorrect);
  const container = document.getElementById("wrongReview");
  const labels = ["أ", "ب", "ج", "د"];

  if (wrongOnes.length === 0) {
    container.innerHTML = `<div class="review-box" style="background:#eafaf1;border-color:#27ae60;">
      <div class="review-title" style="color:#27ae60;">🎉 إجاباتك كلها صح!</div>
    </div>`;
    return;
  }

  let html = `<div class="review-box"><div class="review-title">📌 راجع الأسئلة اللي غلطت فيها (${wrongOnes.length}):</div>`;

  wrongOnes.forEach(item => {
    const qData = questions[item.q - 1];
    html += `<div class="review-q">
      <div><span class="review-q-num">سؤال ${item.q}:</span> ${qData.q}</div>
      <div class="review-answer-wrong">❌ إجابتك: ${item.chosen !== null ? labels[item.chosen] + ') ' + qData.options[item.chosen] : 'لم تجب'}</div>
      <div class="review-answer-right">✅ الإجابة الصح: ${labels[item.correct]}) ${qData.options[item.correct]}</div>
    </div>`;
  });

  html += `</div>`;
  container.innerHTML = html;
}

function sendToTelegram(percentage) {
  const labels = ["أ", "ب", "ج", "د"];
  const wrongOnes = answersLog.filter(a => !a.isCorrect);

  const endTime = new Date();
  const diffSec = Math.floor((endTime - startTime) / 1000);
  const mins = Math.floor(diffSec / 60);
  const secs = diffSec % 60;
  const timeStr = `${mins} دقيقة و ${secs} ثانية`;

  const dateStr = endTime.toLocaleString("ar-EG", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });

  let text = `📝 *نتيجة امتحان أحياء (الدعامة والحركة)*\n\n`;
  text += `👤 الاسم: ${studentName}\n`;
  text += `🎯 الدرجة: ${score} / ${TOTAL_SCORE}\n`;
  text += `📊 النسبة: ${percentage.toFixed(1)}%\n`;
  text += `⏱️ الوقت المستغرق: ${timeStr}\n`;
  text += `📅 التاريخ: ${dateStr}\n`;
  text += `🌐 الـ IP: \`${clientIP}\`\n`;
  text += `💻 الجهاز: ${deviceInfo.substring(0, 100)}\n`;

  if (wrongOnes.length === 0) {
    text += `\n🎉 إجاباتك كلها صح!`;
  } else {
    text += `\n❌ *الأسئلة اللي غلط فيها (${wrongOnes.length}):*\n`;
    wrongOnes.forEach(item => {
      const qData = questions[item.q - 1];
      text += `\n📌 *سؤال ${item.q}:* ${qData.q}\n`;
      text += `❌ إجابته: ${item.chosen !== null ? labels[item.chosen] + ') ' + qData.options[item.chosen] : 'لم يجب'}\n`;
      text += `✅ الصح: ${labels[item.correct]}) ${qData.options[item.correct]}\n`;
    });
  }

  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: TELEGRAM_CHAT_ID,
      text: text,
      parse_mode: "Markdown"
    })
  }).catch(err => console.error("خطأ في الإرسال:", err));
}
</script>
</body>
</html>
